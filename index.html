<script src="https://cdn.tailwindcss.com"></script>
<style>

</style>

<body class="bg-[#050508] text-white min-h-screen antialiased">

<!-- SPLASH -->
<div id="splash" class="fixed inset-0 z-50 bg-[#050508] flex flex-col items-center justify-center p-6">
  <div class="animate-float">
    <img src="logo.png" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'w-28 h-28 bg-white text-black rounded-[28px] flex items-center justify-center font-black text-4xl',innerText:'M'}))" class="w-28 h-28 object-contain rounded-[28px] shadow-[0_0_40px_rgba(255,255,255,0.15)]">

  </div>

  <div class="grid gap-3 mt-7">
    <button onclick="location.href='cristal.html'" class="group text-left p-5 rounded-[24px] bg-gradient-to-br from-violet-600 to-blue-600 relative overflow-hidden"><div class="absolute inset-0 bg-white/0 group-active:bg-white/10 transition"></div><div class="relative"><div class="font-bold flex justify-between">💎 CRISTAL <span class="text-[10px] bg-white/20 px-2 py-0.5 rounded-full">VIDEO</span></div><div class="text-xs opacity-70 mt-1">Máscaras + voz distorsionada</div></div></button>

    <button onclick="location.href='muro.html'" class="text-left p-5 rounded-[24px] bg-white text-black"><div class="font-bold">🧱 MURO</div><div class="text-xs opacity-60 mt-1">Secretos que se borran en 24h</div></button>

  <div class="mt-8 p-3 rounded-2xl bg-white/[0.04] border border-white/5 text-[11px] text-zinc-500 text-center">Sin registro • Sin historial • Todo entre pares. Si cierras, desapareces.</div>
</div>

<script>
setTimeout(()=>{
  document.getElementById('splash').style.opacity='0';
  document.getElementById('splash').style.pointerEvents='none';
  document.getElementById('app').style.opacity='1';
}, 2200);
localStorage.setItem('edad','18+');
</script>
</body>
  </html>
