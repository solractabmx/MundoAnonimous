<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MundoAnonimous - Elige tu mundo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;max-width:100%}
  html,body{overflow-x:hidden;width:100%;margin:0;background:#050508;font-family:'Space Grotesk',sans-serif}
.glass{backdrop-filter:blur(16px);background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08)}
.card:active{transform:scale(0.97)}
</style>
</head>
<body class="min-h-[100dvh] w-screen text-white flex flex-col">

<!-- HEADER -->
<header class="w-full max-w-[500px] mx-auto flex items-center justify-between p-4 pt-6 z-10">
  <div class="flex items-center gap-2">
    <img src="../public/logo.png" class="w-8 h-8 object-contain">
    <span class="font-bold tracking-widest text-sm">MUNDOANONIMOUS</span>
  </div>
  <div class="flex gap-2 items-center">
    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
    <span id="online" class="text-[10px] text-gray-400">1,247 en línea</span>
  </div>
</header>

<div class="w-full max-w-[500px] mx-auto px-4 pb-6 flex-1 flex flex-col gap-4 z-10">

  <div class="mt-2">
    <h1 class="text-2xl font-bold">Elige tu mundo</h1>
    <p class="text-[12px] text-gray-500 mt-1">Todo es anónimo. Nada se guarda.</p>
  </div>

  <!-- GRID DE MUNDOS -->
  <div class="grid grid-cols-1 gap-3 mt-2">

    <!-- CRISTAL -->
    <button onclick="goWorld('cristal')" class="card glass rounded-3xl p-4 flex gap-4 text-left w-full transition-transform relative overflow-hidden">
      <div class="absolute right-0 top-0 w-24 h-24 bg-gradient-to-br from-purple-600/20 to-transparent rounded-full blur-xl"></div>
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-purple-600 to-fuchsia-600 flex items-center justify-center text-2xl shrink-0">💎</div>
      <div class="flex-1">
        <div class="flex items-center gap-2"><h3 class="font-bold">CRISTAL</h3><span class="text-[9px] px-2 py-0.5 rounded-full bg-green-500/20 text-green-400">● 342 online</span></div>
        <p class="text-[11px] text-gray-400 mt-1">Video + Audio random. Con máscaras AR.</p>
        <p class="text-[10px] text-purple-400 mt-1">→ Gasta datos • Más intenso</p>
      </div>
    </button>

    <!-- NIEBLA -->
    <button onclick="goWorld('niebla')" class="card glass rounded-3xl p-4 flex gap-4 text-left w-full transition-transform relative overflow-hidden">
      <div class="absolute right-0 top-0 w-24 h-24 bg-gradient-to-br from-cyan-600/20 to-transparent rounded-full blur-xl"></div>
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-cyan-600 to-blue-600 flex items-center justify-center text-2xl shrink-0">🌫️</div>
      <div class="flex-1">
        <div class="flex items-center gap-2"><h3 class="font-bold">NIEBLA</h3><span class="text-[9px] px-2 py-0.5 rounded-full bg-green-500/20 text-green-400">● 589 online</span><span class="text-[8px] px-2 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300">AHORRA DATOS</span></div>
        <p class="text-[11px] text-gray-400 mt-1">Solo audio a oscuras. Como radio de madrugada.</p>
        <p class="text-[10px] text-cyan-400 mt-1">→ Ideal para celular • Habla de verdad</p>
      </div>
    </button>

    <!-- ARENA -->
    <button onclick="goWorld('arena')" class="card glass rounded-3xl p-4 flex gap-4 text-left w-full transition-transform relative overflow-hidden border border-amber-500/20">
      <div class="absolute right-2 top-2 text-[9px] px-2 py-1 rounded-full bg-amber-500 text-black font-bold">🔥 POPULAR</div>
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-amber-600 to-orange-600 flex items-center justify-center text-2xl shrink-0">⚔️</div>
      <div class="flex-1">
        <div class="flex items-center gap-2"><h3 class="font-bold">ARENA</h3><span class="text-[9px] px-2 py-0.5 rounded-full bg-green-500/20 text-green-400">● 412 online</span></div>
        <p class="text-[11px] text-gray-400 mt-1">Audio + Juegos VS. Gato, debate, adivina la rola.</p>
        <p class="text-[10px] text-amber-400 mt-1">→ La gente se queda 10min, no 5 seg</p>
      </div>
    </button>

    <!-- MURO -->
    <button onclick="goWorld('muro')" class="card glass rounded-3xl p-4 flex gap-4 text-left w-full transition-transform">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-zinc-700 to-zinc-900 flex items-center justify-center text-2xl shrink-0">🧱</div>
      <div class="flex-1">
        <div class="flex items-center gap-2"><h3 class="font-bold">MURO</h3><span class="text-[9px] px-2 py-0.5 rounded-full bg-white/10 text-gray-300">24H</span></div>
        <p class="text-[11px] text-gray-400 mt-1">Secretos anónimos que desaparecen. Sin likes.</p>
      </div>
    </button>

    <!-- TRIBUS -->
    <button onclick="goWorld('tribus')" class="card glass rounded-3xl p-4 flex gap-4 text-left w-full transition-transform">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-700 to-teal-900 flex items-center justify-center text-2xl shrink-0">🔥</div>
      <div class="flex-1">
        <div class="flex items-center gap-2"><h3 class="font-bold">TRIBUS</h3><span class="text-[9px] px-2 py-0.5 rounded-full bg-white/10 text-gray-300">5-10 pers</span></div>
        <p class="text-[11px] text-gray-400 mt-1">Salas de voz por tema: Insomnio, Rolas tristes, Yucatán.</p>
      </div>
    </button>

  </div>

  <button onclick="location.href='/'" class="mt-4 text-[11px] text-gray-600 text-center w-full py-3">← Salir del anonimato</button>

</div>

<script>
// Proteccion 18+
if(localStorage.getItem('edad')!=='18+'){
  location.href='/';
}
function goWorld(mundo){
  // por ahora solo placeholder
  if(mundo==='arena'){
    location.href='./arena/';
  } else if(mundo==='niebla'){
    location.href='./niebla/';
  } else if(mundo==='cristal'){
    location.href='./cristal/';
  } else {
    alert(mundo.toUpperCase()+' viene en la siguiente versión. Por ahora entremos a ARENA y NIEBLA que son las joyas.');
    location.href='./arena/';
  }
}
// Simula usuarios online
setInterval(()=>{
  document.getElementById('online').innerText = Math.floor(800+Math.random()*600)+' en línea';
},3000);
</script>
</body>
</html>
