<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Niebla</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script></head><body class="bg-[#050508] text-white min-h-screen p-4"><div class="max-w-[520px] mx-auto"><div class="flex justify-between"><button onclick="location.href='index.html'" class="text-xs bg-white/10 px-3 py-1 rounded-full">←</button><span class="text-xs">🌫️ NIEBLA</span></div><div class="mt-20 text-center"><div class="w-32 h-32 mx-auto rounded-full bg-gradient-to-br from-zinc-700 to-zinc-900 flex items-center justify-center text-5xl animate-pulse">🌫️</div><p id="st" class="mt-6 text-xs text-zinc-500">Buscando voz anónima...</p><audio id="remote" autoplay></audio><div class="mt-10 flex gap-2 justify-center"><button onclick="next()" class="bg-white text-black px-8 py-3 rounded-full font-bold text-sm">Siguiente</button></div></div></div><script>let peer,ls,cc;async function init(){ls=await navigator.mediaDevices.getUserMedia({audio:true}); peer=new Peer({config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}}); peer.on('open',buscar); peer.on('call',c=>{c.answer(ls); c.on('stream',s=>{document.getElementById('remote').srcObject=s; document.getElementById('st').textContent='Conectado • Anónimo';}); cc=c;});}function buscar(){document.getElementById('st').textContent='Buscando...'; let id='niebla-'+Math.floor(Math.random()*10000); setTimeout(()=>{let call=peer.call(id,ls); if(call){call.on('stream',s=>{document.getElementById('remote').srcObject=s; document.getElementById('st').textContent='Conectado';}); cc=call;}},1500);}function next(){if(cc)cc.close(); buscar();}init()</script></body></html>
